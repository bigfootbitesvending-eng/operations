<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ADM Restock Run — Operations — Bigfoot Bites</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Roboto+Slab:wght@500;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/shared/styles.css">
<link rel="stylesheet" href="/shared/components.css">
<link rel="stylesheet" href="/shared/ledger.css">
<link rel="stylesheet" href="/shared/restock-run.css">
<style>

  
  main { max-width: 560px; margin: 0 auto; padding: 3rem 1.25rem 4rem; }

  
  
  .back-link:hover { text-decoration: underline; }
  .panel {
    background: #fff;
    border: 1px solid var(--rule);
    border-left: 4px solid var(--ledger-green);
    border-radius: 6px;
    padding: 1.5rem;
  }
  .btn-primary {
    display: block;
    width: 100%;
    padding: 0.9rem 1.25rem;
    background: var(--ledger-green);
    color: #fff;
    border: none;
    border-radius: 6px;
    font-family: 'Roboto Slab', serif;
    font-weight: 700;
    font-size: 1rem;
    cursor: pointer;
    transition: opacity 0.15s ease;
  }

  

  

  

  @keyframes spin { to { transform: rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } .spinner { animation: none; } }
</style>
</head>
<body>
<main>
  <a class="back-link" href="https://bigfootbitesvending-eng.github.io/operations/">&larr; Operations</a>
  <header>
    <h1>ADM Restock Run</h1>
    <div class="subtitle">Trigger the daily ADM ingestion and restock check on demand</div>
  </header>
  <div class="panel">
    <button type="button" class="btn-primary" id="trigger-btn" data-webhook="https://randysmith42.app.n8n.cloud/webhook/adm-restock-run">Run Now</button>
    <div id="status-line"></div>
  </div>
</main>
<script src="/shared/config.js"></script>
<script src="/shared/restock-run.js"></script>
</body>
</html>
