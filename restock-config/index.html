<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Restock Config — Bigfoot Bites</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Roboto+Slab:wght@500;700&family=IBM+Plex+Mono:wght@400;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/shared/styles.css">
<style>
  :root {
    --paper: #F3F4F1;
    --ink: #1C2321;
    --ink-soft: #52605B;
    --rule: #D7D9D3;
    --ledger-green: #2F6F5E;
    --ledger-green-soft: #E4EEEA;
    --danger: #B3492D;
    --danger-soft: #F5E4DE;
    --inactive: #9A8F7D;
  }
  [hidden] { display: none !important; }

  main { max-width: 960px; margin: 0 auto; padding: 0 1.25rem 5rem; }
  .breadcrumb { display: inline-block; font-size: 0.8rem; color: var(--ink-soft); text-decoration: none; margin: 1.25rem 0 0.6rem; }
  .breadcrumb:hover { color: var(--ledger-green); }
  .breadcrumb:focus-visible { outline: 2px solid var(--ledger-green); outline-offset: 2px; }
  header { margin-bottom: 1.25rem; border-bottom: 2px solid var(--ink); padding-bottom: 1rem; }
  h1 { font-family: 'Roboto Slab', serif; font-weight: 700; font-size: 1.6rem; margin: 0 0 0.25rem; letter-spacing: -0.01em; }
  .subtitle { color: var(--ink-soft); font-size: 0.9rem; max-width: 62ch; }

  /* Messages live at the top and stay in view while you scroll. */
  #banner {
    position: sticky; top: 0; z-index: 30;
    display: flex; align-items: flex-start; justify-content: space-between; gap: 0.75rem;
    margin: 0 0 0.5rem; padding: 0.85rem 1rem; border: 1px solid; border-radius: 0 0 6px 6px;
    font-size: 0.92rem; line-height: 1.4; box-shadow: 0 4px 10px rgba(0,0,0,0.08);
  }
  #banner.error { background: var(--danger-soft); border-color: var(--danger); color: #7A2E18; }
  #banner.success { background: var(--ledger-green-soft); border-color: var(--ledger-green); color: #1F4A3E; }
  #banner-text { white-space: pre-line; }
  #banner-close { background: transparent; border: none; color: inherit; font-size: 1.3rem; line-height: 1; padding: 0 0.25rem; cursor: pointer; }

  /* Machine picker */
  .chip-bar { display: flex; gap: 0.5rem; overflow-x: auto; padding-bottom: 0.5rem; margin-bottom: 1rem; }
  .chip {
    flex: 0 0 auto; display: inline-flex; align-items: center; gap: 0.45rem;
    font-family: 'Inter', sans-serif; font-weight: 600; font-size: 0.85rem;
    background: #fff; border: 1px solid var(--rule); border-radius: 999px;
    padding: 0.5rem 1rem; color: var(--ink-soft); cursor: pointer; white-space: nowrap;
  }
  .chip[aria-pressed="true"] { background: var(--ledger-green); border-color: var(--ledger-green); color: #fff; }
  .chip-flag { font-size: 0.7rem; font-weight: 500; padding: 0.1rem 0.45rem; border-radius: 20px; background: var(--danger-soft); color: var(--danger); }
  .chip-dot { font-size: 0.7rem; color: var(--ledger-green); }
  .chip[aria-pressed="true"] .chip-dot { color: #fff; }

  .panel { background: #fff; border: 1px solid var(--rule); border-radius: 6px; margin-bottom: 1.25rem; }
  .panel.edited { border-color: var(--ledger-green); box-shadow: 0 0 0 1px var(--ledger-green); }
  .panel-header { display: flex; align-items: center; justify-content: space-between; gap: 0.75rem; flex-wrap: wrap; padding: 0.9rem 1.1rem; border-bottom: 1px solid var(--rule); }
  .panel-header h2 { font-family: 'Roboto Slab', serif; font-size: 1.1rem; margin: 0; }
  .panel-title { display: flex; align-items: center; gap: 0.6rem; flex-wrap: wrap; }
  .panel-meta { display: flex; align-items: center; gap: 0.6rem; flex-wrap: wrap; font-size: 0.82rem; color: var(--ink-soft); }
  .pill { display: inline-block; font-size: 0.72rem; padding: 0.15rem 0.55rem; border-radius: 20px; background: #F0EEE9; color: var(--inactive); }
  .pill.needs { background: var(--danger-soft); color: var(--danger); }
  .pill.vendor { background: var(--ledger-green-soft); color: var(--ledger-green); }

  .needs-note { margin: 0; padding: 0.75rem 1.1rem; border-bottom: 1px solid var(--rule); background: var(--danger-soft); color: #7A2E18; font-size: 0.88rem; }

  fieldset { border: none; margin: 0; padding: 1rem 1.1rem 0.25rem; }
  fieldset + fieldset { border-top: 1px solid var(--rule); }
  legend { font-family: 'Roboto Slab', serif; font-weight: 500; font-size: 0.9rem; padding: 0; margin-bottom: 0.7rem; color: var(--ink); }
  .field-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 0.9rem 1.5rem; padding-bottom: 0.9rem; align-items: start; }
  .label-row { display: flex; align-items: center; gap: 0.4rem; margin-bottom: 0.3rem; }
  .label-row label { margin: 0; font-size: 0.82rem; font-weight: 600; color: var(--ink); }
  .info { width: 1.15rem; height: 1.15rem; padding: 0; border-radius: 50%; border: 1px solid var(--rule); background: #fff; color: var(--ink-soft); font-size: 0.7rem; line-height: 1; flex: 0 0 auto; }
  .info[aria-expanded="true"] { background: var(--ledger-green-soft); border-color: var(--ledger-green); color: var(--ledger-green); }
  .field input { width: 100%; max-width: 12rem; font-family: 'IBM Plex Mono', monospace; font-size: 0.95rem; padding: 0.5rem 0.55rem; border: 1px solid var(--rule); border-radius: 4px; background: #fff; color: var(--ink); }
  .field input:focus { outline: 2px solid var(--ledger-green); outline-offset: 1px; }
  .field input.invalid { border-color: var(--danger); background: var(--danger-soft); }
  .help { margin: 0.4rem 0 0; font-size: 0.8rem; line-height: 1.4; color: var(--ink-soft); max-width: 46ch; }

  .recipient-note { margin: 0; padding: 0.7rem 1.1rem; border-top: 1px solid var(--rule); font-size: 0.8rem; color: var(--ink-soft); }
  .panel-footer { display: flex; align-items: center; gap: 0.6rem; flex-wrap: wrap; padding: 0.8rem 1.1rem; border-top: 1px solid var(--rule); }
  .panel-footer .spacer { flex: 1; }
  .unsaved { font-size: 0.82rem; color: var(--ledger-green); }

  button { font-family: 'Inter', sans-serif; font-size: 0.85rem; font-weight: 500; border-radius: 4px; border: 1px solid transparent; padding: 0.45rem 0.9rem; cursor: pointer; transition: opacity 0.15s ease; }
  button:hover { opacity: 0.85; }
  button:focus-visible { outline: 2px solid var(--ledger-green); outline-offset: 2px; }
  .btn-primary { background: var(--ledger-green); color: #fff; }
  .btn-quiet { background: transparent; color: var(--ink-soft); border-color: var(--rule); }
  button:disabled, button:disabled:hover { opacity: 1; cursor: not-allowed; }
  .btn-primary:disabled { background: #C9CCC6; color: #fff; }
  .btn-quiet:disabled { color: #B5B9B3; border-color: #E4E6E1; }

  .empty-state { padding: 3rem 1rem; text-align: center; color: var(--ink-soft); }

  @media (max-width: 700px) {
    .field-grid { grid-template-columns: 1fr; }
    .field input { max-width: none; }
  }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<main>
  <div id="banner" role="alert" aria-live="assertive" hidden>
    <span id="banner-text"></span>
    <button id="banner-close" type="button" aria-label="Dismiss message">×</button>
  </div>

  <a class="breadcrumb" href="/">← Operator Tools</a>
  <header>
    <h1>Restock Config</h1>
    <div class="subtitle">Pick a machine, then set when an item is flagged for the Light list and when a trip is recommended. A change takes effect on the next restock run.</div>
  </header>

  <div class="chip-bar" id="chip-bar" role="group" aria-label="Choose a machine"></div>
  <div id="machines"></div>
  <div class="empty-state" id="loading">Loading…</div>
</main>

<script src="/shared/config.js"></script>
<script>
  // "Restock Config — CRUD API" in n8n. One URL: GET lists, POST saves.
  const API_BASE = 'https://randysmith42.app.n8n.cloud/webhook/restock-config';

  // The columns the API accepts. A save always sends all of them.
  const ALL_FIELDS = [
    'light_window_days', 'urgent_floor_units', 'urgent_sales_gate',
    'trip_cost', 'anchor_stockout_threshold', 'anchor_edr_floor',
    'sparseness_last_units', 'sparseness_min_categories',
    'sparseness_threshold_candy', 'sparseness_threshold_chips', 'sparseness_threshold_drinks',
    'sparseness_frozen_meals', 'sparseness_frozen_treats', 'sparseness_cooler'
  ];

  // Names, input rules and plain explanations. Which of these a machine shows is decided
  // by the API (required_fields, from the same table the restock runs check), not here.
  const FIELDS = {
    light_window_days: {
      label: 'Light window (days)', min: 1, step: 1,
      help: () => 'An item is flagged when it is expected to run out within this many days. Example: 4 flags an item with 3.5 days of stock left, but not one with 5.'
    },
    urgent_floor_units: {
      label: 'Last-unit floor (units)', min: 0, step: 1,
      help: () => 'An item with this many units or fewer, and below its target stock, is flagged even when its runway looks long, if it also passes the sales gate. 0 turns this off. Example: 2 flags an item with 2 left of a target of 4.'
    },
    urgent_sales_gate: {
      label: 'Sales gate (sold in 30 days)', min: 0, step: 1,
      help: () => 'The last-unit floor only applies to items that sold at least this many in the last 30 days, so slow sellers do not cause a trip. Example: 4 flags an item with 1 left that sold 4; one that sold 3 is not flagged.'
    },
    trip_cost: {
      label: 'Trip cost ($)', min: 0.01, step: 0.01,
      help: (v) => 'What one trip costs, compared with the daily revenue at risk on flagged items. Example: 12.50.' + (v === 'ADM' ? ' For ADM this is shown for information and does not decide the recommendation.' : '')
    },
    anchor_stockout_threshold: {
      label: 'Anchor stockouts that call for a trip', min: 1, step: 1,
      help: () => 'Anchors are the items that earn the most. A trip is recommended when this many anchors are empty. Example: 3.'
    },
    anchor_edr_floor: {
      label: 'Anchor revenue floor ($ per day)', min: 0.01, step: 0.01,
      help: () => 'An item that brings in at least this much per day counts as an anchor. Example: 1.00 makes an item that earns $1 a day an anchor.'
    },
    sparseness_last_units: {
      label: 'Sparse at (units left)', min: 0, step: 1,
      help: (v) => v === 'AV Live'
        ? 'Not used by AV Live yet. It counts empty slots only, so this value is kept for later.'
        : 'A facing counts as sparse when it is empty, or down to this many units or fewer and selling well enough to pass the sales gate. Example: 1.'
    },
    sparseness_min_categories: {
      label: 'Sparse categories that call for a trip', min: 1, step: 1,
      help: () => 'How many categories must look sparse before a trip is recommended. Example: 2 means chips and candy both need to be sparse.'
    },
    sparseness_threshold_candy: { label: 'Candy', min: 1, step: 1, help: (v) => thresholdHelp(v, 'candy') },
    sparseness_threshold_chips: { label: 'Chips', min: 1, step: 1, help: (v) => thresholdHelp(v, 'chips') },
    sparseness_threshold_drinks: { label: 'Drinks', min: 1, step: 1, help: (v) => thresholdHelp(v, 'drinks') },
    sparseness_frozen_meals: { label: 'Frozen meals', min: 1, step: 1, help: (v) => thresholdHelp(v, 'frozen meals') },
    sparseness_frozen_treats: { label: 'Frozen treats', min: 1, step: 1, help: (v) => thresholdHelp(v, 'frozen treats') },
    sparseness_cooler: { label: 'Cooler', min: 1, step: 1, help: (v) => thresholdHelp(v, 'cooler') }
  };

  function thresholdHelp(vendor, name) {
    return vendor === 'AV Live'
      ? 'The ' + name + ' section looks sparse when this many slots are empty. Example: 2.'
      : 'The ' + name + ' category looks sparse when this many facings are empty or down to a last unit. Example: 8.';
  }

  const GROUPS = [
    { title: 'When an item is flagged', fields: ['light_window_days', 'urgent_floor_units', 'urgent_sales_gate'] },
    { title: 'When a trip is recommended', fields: ['trip_cost', 'anchor_stockout_threshold', 'anchor_edr_floor'] },
    { title: 'Sparse shelves', fields: ['sparseness_last_units', 'sparseness_min_categories'] },
    { title: 'Sparse shelf limits by category', fields: ['sparseness_threshold_candy', 'sparseness_threshold_chips', 'sparseness_threshold_drinks', 'sparseness_frozen_meals', 'sparseness_frozen_treats', 'sparseness_cooler'] }
  ];

  const machinesEl = document.getElementById('machines');
  const chipBar = document.getElementById('chip-bar');
  const loadingEl = document.getElementById('loading');
  const bannerEl = document.getElementById('banner');
  const bannerText = document.getElementById('banner-text');

  let rows = [];
  let selected = null;
  const cardEls = {};   // machine -> card element
  const chipEls = {};   // machine -> chip button
  const editedSet = new Set();
  let bannerTimer = null;

  // ---------- Messages (always at the top) ----------
  function showBanner(kind, message) {
    clearTimeout(bannerTimer);
    bannerEl.className = kind;
    bannerText.textContent = message;
    bannerEl.hidden = false;
    window.scrollTo({ top: 0, behavior: 'smooth' });
    if (kind === 'success') bannerTimer = setTimeout(hideBanner, 8000);
  }
  function hideBanner() { clearTimeout(bannerTimer); bannerEl.hidden = true; }
  document.getElementById('banner-close').addEventListener('click', hideBanner);

  // ---------- API ----------
  async function apiCall(options) {
    let res;
    try {
      res = await fetch(API_BASE, options);
    } catch (err) {
      throw new Error('Could not reach the server. Check your connection and try again.');
    }
    let body = null;
    try { body = await res.json(); } catch (e) { /* not JSON */ }
    if (!res.ok) {
      if (res.status === 403) throw new Error('The server refused the request (403). Check the API key in /shared/config.js.');
      throw new Error((body && body.error) || ('The server returned ' + res.status + '.'));
    }
    return body;
  }

  async function loadAll() {
    const body = await apiCall({ method: 'GET', headers: { 'X-API-Key': API_KEY } });
    if (!Array.isArray(body)) throw new Error('The server returned something unexpected instead of a list of machines.');
    rows = body;
  }

  // ---------- Helpers ----------
  function el(tag, className, text) {
    const node = document.createElement(tag);
    if (className) node.className = className;
    if (text !== undefined) node.textContent = text;
    return node;
  }
  function inputId(machine, field) { return 'f-' + machine + '-' + field; }
  function shown(value) { return value === null || value === undefined ? '' : String(value); }
  function savedAt(iso) {
    if (!iso) return '';
    return new Date(iso).toLocaleString('en-US', { timeZone: 'America/Chicago', month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' });
  }
  function editableFields(row) {
    // alert_recipient is required too, but it is set on the location, not here.
    return (row.required_fields || []).filter(f => f !== 'alert_recipient');
  }
  function labelFor(field) { return FIELDS[field] ? FIELDS[field].label : field; }
  function nameOf(row) { return row.display_name || row.machine; }

  // ---------- Machine picker ----------
  function buildChip(row) {
    const chip = el('button', 'chip');
    chip.type = 'button';
    chip.appendChild(el('span', null, nameOf(row)));
    if (!row.has_config) chip.appendChild(el('span', 'chip-flag', 'needs config'));
    const dot = el('span', 'chip-dot', '●');
    dot.title = 'Unsaved changes';
    dot.hidden = !editedSet.has(row.machine);
    chip.appendChild(dot);
    chip.dotEl = dot;
    chip.setAttribute('aria-pressed', String(row.machine === selected));
    chip.addEventListener('click', () => select(row.machine));
    return chip;
  }

  function select(machine) {
    selected = machine;
    Object.keys(chipEls).forEach(m => chipEls[m].setAttribute('aria-pressed', String(m === machine)));
    Object.keys(cardEls).forEach(m => { cardEls[m].hidden = (m !== machine); });
    try {
      const url = new URL(location.href);
      url.searchParams.set('machine', machine);
      history.replaceState(null, '', url.toString());
    } catch (e) { /* the address bar is a nicety, not required */ }
  }

  function setEdited(machine, edited) {
    if (edited) editedSet.add(machine); else editedSet.delete(machine);
    if (chipEls[machine]) chipEls[machine].dotEl.hidden = !edited;
  }

  // ---------- Rendering ----------
  function buildAll() {
    machinesEl.innerHTML = '';
    chipBar.innerHTML = '';
    Object.keys(cardEls).forEach(m => delete cardEls[m]);
    Object.keys(chipEls).forEach(m => delete chipEls[m]);
    editedSet.clear();
    loadingEl.hidden = true;

    if (!rows.length) {
      machinesEl.appendChild(el('div', 'empty-state', 'No machines found. Add a machine to locations first.'));
      return;
    }

    const wanted = new URLSearchParams(location.search).get('machine');
    const needsConfig = rows.find(r => !r.has_config);
    selected = (rows.find(r => r.machine === wanted) || needsConfig || rows[0]).machine;

    const unknown = new Set();
    rows.forEach(row => {
      editableFields(row).forEach(f => { if (!FIELDS[f]) unknown.add(f); });
      chipEls[row.machine] = buildChip(row);
      cardEls[row.machine] = buildCard(row);
      chipBar.appendChild(chipEls[row.machine]);
      machinesEl.appendChild(cardEls[row.machine]);
    });
    select(selected);
    if (unknown.size) {
      showBanner('error', 'This page does not know how to describe: ' + Array.from(unknown).join(', ') + '.\nThe machines that use it still show the field, but it has no explanation. Update the page.');
    }
  }

  // After a save, rebuild only that machine so edits on other machines survive.
  async function refreshMachine(machine) {
    await loadAll();
    const row = rows.find(r => r.machine === machine);
    if (!row) return;
    setEdited(machine, false);
    const newCard = buildCard(row);
    newCard.hidden = (selected !== machine);
    cardEls[machine].replaceWith(newCard);
    cardEls[machine] = newCard;
    const newChip = buildChip(row);
    chipEls[machine].replaceWith(newChip);
    chipEls[machine] = newChip;
  }

  function buildCard(row) {
    const name = nameOf(row);
    const fields = editableFields(row);
    const helpItems = [];
    const card = el('section', 'panel');
    card.id = 'card-' + row.machine;

    const head = el('div', 'panel-header');
    const title = el('div', 'panel-title');
    title.appendChild(el('h2', null, name));
    title.appendChild(el('span', 'pill vendor', row.vendor));
    if (!row.active) title.appendChild(el('span', 'pill', 'Inactive'));
    if (!row.has_config) title.appendChild(el('span', 'pill needs', 'Needs config'));
    head.appendChild(title);

    const meta = el('div', 'panel-meta');
    if (row.has_config && row.updated_at) meta.appendChild(el('span', null, 'Last saved ' + savedAt(row.updated_at)));
    const explainBtn = el('button', 'btn-quiet', 'Explain settings');
    explainBtn.type = 'button';
    meta.appendChild(explainBtn);
    head.appendChild(meta);
    card.appendChild(head);

    if (!row.has_config) {
      card.appendChild(el('p', 'needs-note', 'This machine has no config yet, so its restock run stops until you save one.'));
    }

    // Fields, grouped. Anything not in a group lands in "Other settings".
    const placed = new Set();
    GROUPS.forEach(group => {
      const inGroup = group.fields.filter(f => fields.includes(f));
      if (!inGroup.length) return;
      inGroup.forEach(f => placed.add(f));
      card.appendChild(buildFieldset(row, group.title, inGroup, helpItems));
    });
    const other = fields.filter(f => !placed.has(f));
    if (other.length) card.appendChild(buildFieldset(row, 'Other settings', other, helpItems));

    card.appendChild(el('p', 'recipient-note',
      'Restock alerts for ' + name + ' go to ' + (row.alert_recipient || '(nobody yet)') +
      '. There is no tool for changing the recipient yet; it is stored on the location in the locations table.'));

    const foot = el('div', 'panel-footer');
    const unsaved = el('span', 'unsaved', '');
    const spacer = el('span', 'spacer');
    const resetBtn = el('button', 'btn-quiet', 'Reset');
    resetBtn.type = 'button';
    const saveBtn = el('button', 'btn-primary', 'Save changes');
    saveBtn.type = 'button';
    foot.appendChild(unsaved);
    foot.appendChild(spacer);
    foot.appendChild(resetBtn);
    foot.appendChild(saveBtn);
    card.appendChild(foot);

    function isEdited() {
      return fields.some(f => document.getElementById(inputId(row.machine, f)).value.trim() !== shown(row[f]).trim());
    }
    function refreshEdited() {
      const edited = isEdited();
      card.classList.toggle('edited', edited);
      unsaved.textContent = edited ? 'Unsaved changes' : '';
      saveBtn.disabled = !edited;
      resetBtn.disabled = !edited;
      saveBtn.title = edited ? '' : 'Nothing to save yet. Change a setting first.';
      setEdited(row.machine, edited);
    }
    function setAllHelp(show) {
      helpItems.forEach(item => setHelp(item, show));
      explainBtn.textContent = show ? 'Hide explanations' : 'Explain settings';
    }

    explainBtn.addEventListener('click', () => setAllHelp(!helpItems.every(i => !i.help.hidden)));
    card.addEventListener('input', (e) => { e.target.classList.remove('invalid'); refreshEdited(); });
    resetBtn.addEventListener('click', () => {
      fields.forEach(f => {
        const input = document.getElementById(inputId(row.machine, f));
        input.value = shown(row[f]);
        input.classList.remove('invalid');
      });
      refreshEdited();
    });
    saveBtn.addEventListener('click', () => saveMachine(row, fields, saveBtn));

    // Start gray: nothing has changed yet.
    saveBtn.disabled = true;
    resetBtn.disabled = true;
    saveBtn.title = 'Nothing to save yet. Change a setting first.';
    return card;
  }

  function setHelp(item, show) {
    item.help.hidden = !show;
    item.btn.setAttribute('aria-expanded', String(show));
  }

  function buildFieldset(row, title, groupFields, helpItems) {
    const set = el('fieldset');
    set.appendChild(el('legend', null, title));
    const grid = el('div', 'field-grid');
    groupFields.forEach(f => {
      const meta = FIELDS[f] || { label: f, min: 0, step: 'any', help: () => 'No explanation yet. This setting is new to the page.' };
      const id = inputId(row.machine, f);
      const wrap = el('div', 'field');

      const labelRow = el('div', 'label-row');
      const label = el('label', null, meta.label);
      label.htmlFor = id;
      const info = el('button', 'info', '?');
      info.type = 'button';
      info.setAttribute('aria-expanded', 'false');
      info.setAttribute('aria-controls', id + '-help');
      info.setAttribute('aria-label', 'Explain ' + meta.label);
      labelRow.appendChild(label);
      labelRow.appendChild(info);

      const input = document.createElement('input');
      input.type = 'number';
      input.inputMode = 'decimal';
      input.id = id;
      input.min = meta.min;
      input.step = meta.step;
      input.value = shown(row[f]);
      input.setAttribute('aria-describedby', id + '-help');

      const help = el('p', 'help', meta.help(row.vendor));
      help.id = id + '-help';
      help.hidden = true;

      const item = { btn: info, help: help };
      helpItems.push(item);
      info.addEventListener('click', () => setHelp(item, help.hidden));

      wrap.appendChild(labelRow);
      wrap.appendChild(input);
      wrap.appendChild(help);
      grid.appendChild(wrap);
    });
    set.appendChild(grid);
    return set;
  }

  // ---------- Saving ----------
  async function saveMachine(row, fields, saveBtn) {
    const name = nameOf(row);
    hideBanner();

    // Quick check against the same required list the restock runs use. The server checks again.
    const missing = fields.filter(f => document.getElementById(inputId(row.machine, f)).value.trim() === '');
    document.querySelectorAll('#card-' + row.machine + ' input').forEach(i => i.classList.remove('invalid'));
    if (missing.length) {
      missing.forEach(f => document.getElementById(inputId(row.machine, f)).classList.add('invalid'));
      document.getElementById(inputId(row.machine, missing[0])).focus();
      showBanner('error', 'Not saved. Fill in these for ' + name + ': ' + missing.map(labelFor).join(', ') + '.');
      return;
    }

    // Start from what is stored, then replace what this card shows.
    const payload = { operation: 'save', machine: row.machine };
    ALL_FIELDS.forEach(f => { payload[f] = row[f] === undefined ? null : row[f]; });
    fields.forEach(f => { payload[f] = document.getElementById(inputId(row.machine, f)).value.trim(); });

    saveBtn.disabled = true;
    saveBtn.textContent = 'Saving…';
    try {
      await apiCall({
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'X-API-Key': API_KEY },
        body: JSON.stringify(payload)
      });
      await refreshMachine(row.machine);
      showBanner('success', 'Saved ' + name + '. It takes effect on the next restock run.');
    } catch (err) {
      saveBtn.disabled = false;
      saveBtn.textContent = 'Save changes';
      showBanner('error', 'Not saved. ' + name + ': ' + err.message);
    }
  }

  // Warn before leaving with unsaved changes.
  if (window.addEventListener) {
    window.addEventListener('beforeunload', (e) => {
      if (editedSet.size) { e.preventDefault(); e.returnValue = ''; }
    });
  }

  // ---------- Start ----------
  loadAll()
    .then(buildAll)
    .catch(err => {
      loadingEl.hidden = true;
      showBanner('error', 'Could not load the restock config. ' + err.message);
    });
</script>
</body>
</html>
