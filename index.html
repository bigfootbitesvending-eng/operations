<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Operations — Bigfoot Bites</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Roboto+Slab:wght@500;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/shared/styles.css">
<style>
  main { max-width: 720px; margin: 0 auto; padding: 3rem 1.25rem 4rem; }
  header { margin-bottom: 2rem; border-bottom: 2px solid var(--ink); padding-bottom: 1rem; }
  h1 { font-size: 1.6rem; margin-bottom: 0.25rem; }
  .subtitle { color: var(--ink-soft); font-size: 0.9rem; }
  .tools { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 1rem; }
</style>
</head>
<body>
<main>
  <header>
    <h1>Operations</h1>
    <div class="subtitle">On-demand triggers for workflows that normally run on a schedule</div>
  </header>
  <div class="tools">
    <a class="tool-card" href="https://bigfootbitesvending-eng.github.io/operations/adm-restock/">
      <div class="tool-name">ADM Restock Run</div>
      <div class="tool-desc">Fire the ADM daily ingestion and restock check on demand.</div>
    </a>
  </div>
</main>
</body>
</html>
